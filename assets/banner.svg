<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>

    <style>
      .glow-circle {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .float-node {
        animation: float 8s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
        100% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.45; }
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-25px) rotate(10deg); }
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 58px;
        fill: url(#titleGrad);
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 22px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Background Dynamic / Decorative Glows -->
  <circle cx="1050" cy="60" r="180" fill="url(#accentGrad)" class="glow-circle" />
  <circle cx="150" cy="240" r="220" fill="url(#accentGrad)" class="glow-circle" style="animation-delay: -3s;" />

  <!-- Network / Grid Lines Background -->
  <path d="M 0,100 Q 300,180 600,80 T 1200,160" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2" />
  <path d="M 0,200 Q 400,60 800,220 T 1200,100" fill="none" stroke="#818cf8" stroke-opacity="0.12" stroke-width="2" />

  <!-- Visual Nodes / Icons in Background -->
  <g class="float-node" stroke="#818cf8" stroke-opacity="0.3" fill="none" stroke-width="2">
    <rect x="980" y="80" width="120" height="80" rx="8" />
    <line x1="980" y1="110" x2="1100" y2="110" />
    <circle cx="1000" cy="95" r="4" fill="#38bdf8" />
    <circle cx="1015" cy="95" r="4" fill="#818cf8" />
    <circle cx="1030" cy="95" r="4" fill="#c084fc" />
  </g>

  <!-- Foreground Title Card -->
  <g transform="translate(80, 85)">
    <!-- Pill Category Tag -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="110" y="21" text-anchor="middle" class="badge-text">⚡ AWESOME LIST 2026</text>
    
    <!-- Title -->
    <text x="0" y="95" class="title-text">Awesome No-Code</text>

    <!-- Subtitle -->
    <text x="0" y="135" class="subtitle-text">🚀 Curated SaaS Platforms &amp; Open-Source Visual App Builders</text>
  </g>
</svg>
