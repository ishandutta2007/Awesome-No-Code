<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#818cf8" stop-opacity=".3"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".05"/></linearGradient><style>@keyframes pulse{0%{transform:scale(1) translate(0,0);opacity:.2}}@keyframes float{0%{transform:translateY(0) rotate(0deg)}}.glow-circle{animation:pulse 6s ease-in-out infinite alternate}.float-node{animation:float 8s ease-in-out infinite alternate}.title-text{font-weight:900;font-size:58px;fill:url(#titleGrad);letter-spacing:-1px}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:22px;fill:#94a3b8;letter-spacing:.5px}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><circle cx="1050" cy="60" r="180" fill="url(#accentGrad)" class="glow-circle"/><circle cx="150" cy="240" r="220" fill="url(#accentGrad)" class="glow-circle" style="animation-delay:-3s"/><path fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="2" d="M 0,100 Q 300,180 600,80 T 1200,160"/><path fill="none" stroke="#818cf8" stroke-opacity=".12" stroke-width="2" d="M 0,200 Q 400,60 800,220 T 1200,100"/><g fill="none" stroke="#818cf8" stroke-opacity=".3" stroke-width="2" class="float-node"><rect width="120" height="80" x="980" y="80" rx="8"/><line x1="980" x2="1100" y1="110" y2="110"/><circle cx="1000" cy="95" r="4" fill="#38bdf8"/><circle cx="1015" cy="95" r="4" fill="#818cf8"/><circle cx="1030" cy="95" r="4" fill="#c084fc"/></g><g transform="translate(80, 85)"><rect width="220" height="32" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="110" y="21" class="badge-text" text-anchor="middle">⚡ AWESOME LIST 2026</text><text x="0" y="95" class="title-text">Awesome No-Code</text><text x="0" y="135" class="subtitle-text">🚀 Curated SaaS Platforms &amp; Open-Source Visual App Builders</text></g></svg>